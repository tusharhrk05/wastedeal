<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · WasteDeal</title><link rel="stylesheet" href="/site.css"></head>
<body>
  <main class="auth-page"><section class="auth-shell">
    <aside class="auth-aside"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">↻</span><span>Waste<span>Deal</span></span></a><div><p class="eyebrow">Good to see you again</p><h1>Make your next connection count.</h1><p>Sign in to continue listing and finding materials on WasteDeal.</p></div></aside>
    <div class="auth-panel"><div class="auth-card"><h2>Welcome back</h2><p>Enter your account details to continue.</p>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <form class="form-stack" method="post" action="/login"><div><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" placeholder="you@company.com" required></div><div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required></div><button type="submit">Sign in <span aria-hidden="true">→</span></button></form>
      <p class="form-help">New to WasteDeal? <a href="/signup">Create an account</a></p>
    </div></div>
  </section></main>
</body>
</html>
